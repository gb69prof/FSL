<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Atrio – Loop 360°</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #viewer{
    width:100vw; height:100vh;
    position:relative;
    overflow:hidden;
    touch-action:none;
    background:#000;
  }
  /* Il loop vero: immagine ripetuta in X */
  #pano{
    width:100%; height:100%;
    background-image:url("assets/panorama_360_loop.jpg");
    background-repeat:repeat-x;
    background-position:0px 50%;
    background-size:auto 100%; /* altezza piena, larghezza proporzionale */
    will-change:background-position;
  }
  /* Immagine “di servizio” invisibile per leggere naturalWidth/naturalHeight */
  #probe{
    position:absolute;
    width:1px; height:1px;
    opacity:0; pointer-events:none;
  }
</style>
</head>
<body>
  <div id="viewer">
    <div id="pano"></div>
    <img id="probe" src="assets/panorama_360_loop.jpg" alt="">
  </div>

<script>
(() => {
  const viewer = document.getElementById("viewer");
  const pano   = document.getElementById("pano");
  const probe  = document.getElementById("probe");

  let pos = 0;        // posizione (px) nel “nastro” panoramico
  let vel = 0;        // inerzia (px/frame)
  let lastX = null;   // ultimo x del dito/mouse
  const friction = 0.92;

  let panoWidth = 1;  // larghezza reale (in px a schermo) dell'immagine ripetuta

  function mod(n, m){
    // modulo sempre positivo
    return ((n % m) + m) % m;
  }

  function computePanoWidth(){
    const H = window.innerHeight;
    const nw = probe.naturalWidth;
    const nh = probe.naturalHeight;

    if (!nw || !nh) return; // se non ancora carica
    const ratio = nw / nh;
    panoWidth = Math.max(1, Math.round(H * ratio));
  }

  function render(){
    // loop infinito: pos sempre dentro [0, panoWidth)
    pos = mod(pos, panoWidth);
    // background-position in negativo per muovere il mondo “sotto il dito”
    pano.style.backgroundPosition = `${-pos}px 50%`;
  }

  function kick(){
    if (Math.abs(vel) > 0.05){
      pos += vel;
      vel *= friction;
      render();
    }
    requestAnimationFrame(kick);
  }

  // Pointer events (iPad Safari ok)
  viewer.addEventListener("pointerdown", (e) => {
    lastX = e.clientX;
    vel = 0;
    viewer.setPointerCapture(e.pointerId);
  });

  viewer.addEventListener("pointermove", (e) => {
    if (lastX === null) return;
    const dx = e.clientX - lastX;

    // dx>0 (dito va a destra) -> panorama deve “scorrere” coerente
    // qui scegliamo pos -= dx (sensazione naturale tipo “trascino lo spazio”)
    pos -= dx;
    vel = -dx;

    lastX = e.clientX;
    render();
  });

  function endPointer(e){
    lastX = null;
    try { viewer.releasePointerCapture(e.pointerId); } catch(_){}
  }

  viewer.addEventListener("pointerup", endPointer);
  viewer.addEventListener("pointercancel", endPointer);
  viewer.addEventListener("pointerleave", endPointer);

  // Caricamento immagine + resize
  probe.addEventListener("load", () => {
    computePanoWidth();
    render();
  });

  window.addEventListener("resize", () => {
    computePanoWidth();
    render();
  });

  // avvio
  kick();
})();
</script>
</body>
</html>
