<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Atrio – Loop 360°</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #viewer{
    width:100vw; height:100vh;
    position:relative;
    overflow:hidden;
    touch-action:none;
    background:#000;
  }
  /* Qui avviene la magia: background ripetuto orizzontalmente */
  #pano{
    width:100%; height:100%;
    background-image:url("assets/panorama_360_loop.jpg");
    background-repeat:repeat-x;
    background-position:0px 50%;
    background-size:auto 100%; /* altezza piena, larghezza proporzionale */
    will-change:background-position;
  }
</style>
</head>
<body>
  <div id="viewer">
    <div id="pano"></div>
  </div>

<script>
  const viewer = document.getElementById('viewer');
  const pano = document.getElementById('pano');

  let pos = 0;          // posizione orizzontale (px)
  let vel = 0;          // velocità (px/frame)
  let lastX = null;     // ultimo x
  const friction = 0.93;

  // Calcolo della larghezza “reale” del panorama a schermo (in px)
  // Serve per fare il modulo e loopare senza scatti.
  let panoWidth = 3000; // fallback

  function computePanoWidth(){
    // carico l'immagine per conoscere rapporto e calcolare la larghezza visualizzata
    const img = new Image();
    img.onload = () => {
      const ratio = img.naturalWidth / img.naturalHeight;
      panoWidth = Math.round(window.innerHeight * ratio);
    };
    img.src = getComputedStyle(pano).backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
  }

  function wrap(){
    // mantiene pos sempre dentro [0, panoWidth)
    if (panoWidth <= 0) return;
    pos = ((pos % panoWidth) + panoWidth) % panoWidth;
  }

  function render(){
    wrap();
    // Nota: sposto in negativo per “trascinare” a destra/sinistra
    pano.style.backgroundPosition = `${-pos}px 50%`;
  }

  viewer.addEventListener('pointerdown', (e) => {
    lastX = e.clientX;
    vel = 0;
    viewer.setPointerCapture(e.pointerId);
  });

  viewer.addEventListener('pointermove', (e) => {
    if (lastX !== null){
      const dx = e.clientX - lastX;
      // dx positivo = dito va a destra -> panorama si muove coerentemente
      vel = -dx;     // invertiamo per mantenere sensazione naturale
      pos += vel;
      render();
      lastX = e.clientX;
    }
  });

  viewer.addEventListener('pointerup', (e) => {
    lastX = null;
    try { viewer.releasePointerCapture(e.pointerId); } catch(_){}
  });

  function animate(){
    if (Math.abs(vel) > 0.1){
      pos += vel;
      vel *= friction;
      render();
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    computePanoWidth();
    render();
  });

  computePanoWidth();
  render();
  animate();
</script>
</body>
</html>
