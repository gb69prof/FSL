<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il villaggio neolitico</title>

  <style>
    /* =========================
       CONFIG BASE (facile da modificare)
       ========================= */
    :root{
      --gold: #d8b84a;      /* giallo/oro */
      --gold-2: #f2d46b;    /* oro chiaro */
      --panel: rgba(18, 18, 18, 0.72);
      --panel-2: rgba(18, 18, 18, 0.62);
      --text: #f3f3f3;
      --muted: rgba(255,255,255,0.72);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 18px;
      --border: 1px solid rgba(255,255,255,0.14);
      --maxw: 1200px;

      /* Sfondo: richiesto dal prompt */
      --bg-url: url("assets/sfondo.jpg");
    }

    /* =========================
       RESET + BODY
       ========================= */
    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      /* Background richiesto: ripetuto o coprente.
         Qui lo uso "cover" + fallback di repeat su schermi grandi. */
      background-image: var(--bg-url);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
    }

    /* Overlay leggero per garantire leggibilità */
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 800px at 30% 20%, rgba(0,0,0,0.35), rgba(0,0,0,0.72));
      z-index: -1;
    }

    /* =========================
       LAYOUT PRINCIPALE
       ========================= */
    .app{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 16px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100%;
    }

    /* =========================
       HEADER: home | titolo | bot
       ========================= */
    header{
      background: var(--panel);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 12px 12px 10px;
    }

    .header-row{
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      gap: 10px;
    }

    .icon-btn{
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.18);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
      user-select: none;
      text-decoration: none; /* per <a> */
    }

    .icon-btn:hover{
      transform: translateY(-1px);
      background: rgba(0,0,0,0.28);
    }

    .icon-btn img{
      width: 28px;
      height: 28px;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    h1{
      margin: 0;
      text-align: center;
      font-size: 1.25rem;
      letter-spacing: 0.4px;
      color: var(--gold-2);
      text-shadow: 0 2px 18px rgba(0,0,0,0.55);
      padding: 0 6px;
    }

    .gold-line{
      margin-top: 10px;
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 999px;
      opacity: 0.95;
    }

    /* =========================
       CORPO: due colonne
       ========================= */
    .main{
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 14px;
      flex: 1;
    }

    .panel{
      background: var(--panel);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 320px;
    }

    /* Riquadro 3: area contenuto dinamico */
    #content{
      position: relative;
      padding: 10px;
      display: grid;
      align-items: stretch;
    }

    .content-inner{
      border-radius: calc(var(--radius) - 8px);
      border: 1px solid rgba(255,255,255,0.10);
      overflow: hidden;
      background: rgba(0,0,0,0.18);
      min-height: 320px;
    }

    /* Riquadro 4: testo da file */
    #textPanel{
      padding: 10px;
      display: grid;
      align-items: stretch;
    }

    .text-inner{
      border-radius: calc(var(--radius) - 8px);
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
      padding: 14px 14px;
      overflow: auto; /* scrollbar richiesta */
      line-height: 1.55;
      font-size: 0.98rem;
      color: var(--text);
      min-height: 320px;
      white-space: pre-wrap;  /* rispetta ritorni a capo del txt */
    }

    .text-inner .muted{
      color: var(--muted);
      font-style: italic;
    }

    /* Messaggi di errore chiari */
    .error-box{
      padding: 14px;
      color: #ffd6d6;
      background: rgba(120,0,0,0.22);
      border: 1px solid rgba(255,80,80,0.35);
      border-radius: 12px;
      margin: 10px;
      line-height: 1.45;
    }

    /* =========================
       BARRA BOTTOM: 4 icone
       ========================= */
    .bottom-bar{
      background: var(--panel-2);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      align-items: center;
    }

    .bottom-btn{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
      user-select: none;
      min-height: 54px;
    }

    .bottom-btn:hover{
      transform: translateY(-1px);
      background: rgba(0,0,0,0.28);
    }

    .bottom-btn img{
      width: 26px;
      height: 26px;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    .bottom-btn span{
      display: none; /* icone pure, ma puoi attivare se vuoi */
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* =========================
       CONTENUTI NEL RIQUADRO 3
       ========================= */

    /* Copertina: immagine piena */
    .cover-img{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: rgba(0,0,0,0.2);
      min-height: 320px;
    }

    /* Iframe per maps/video/3d */
    .embed-frame{
      width: 100%;
      height: 100%;
      min-height: 320px;
      border: 0;
      display: block;
      background: rgba(0,0,0,0.2);
    }

    /* =========================
       GALLERIA (riquadro 7)
       ========================= */
    .gallery{
      height: 100%;
      min-height: 320px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
      padding: 10px;
    }

    .gallery-main{
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
      display: grid;
      place-items: center;
      min-height: 240px;
    }

    .gallery-main img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: rgba(0,0,0,0.22);
    }

    .thumbs{
      display: flex;
      gap: 10px;
      overflow-x: auto;   /* scorrimento orizzontale */
      padding: 6px 4px 2px;
      scrollbar-width: thin;
    }

    .thumb{
      flex: 0 0 auto;
      width: 88px;
      height: 58px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease;
    }

    .thumb:hover{
      transform: translateY(-1px);
      border-color: rgba(216,184,74,0.55);
    }

    .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================
       RESPONSIVE: colonne -> righe
       ========================= */
    @media (max-width: 860px){
      body{ background-attachment: scroll; }
      .main{
        grid-template-columns: 1fr;
      }
      h1{ font-size: 1.12rem; }
      .bottom-bar{
        grid-template-columns: repeat(4, 1fr);
      }
      .bottom-btn span{ display: none; }
    }

    @media (max-width: 460px){
      .header-row{
        grid-template-columns: 50px 1fr 50px;
      }
      .icon-btn{
        width: 48px;
        height: 48px;
      }
      .bottom-btn{
        padding: 10px;
        min-height: 50px;
      }
      .bottom-btn img{
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- =========================
         HEADER (Riquadro 1 + Titolo + Riquadro 2)
         ========================= -->
    <header>
      <div class="header-row">
        <!-- Riquadro 1 (Home) -->
        <a class="icon-btn" href="index.html" title="Home">
          <img src="assets/home.svg" alt="Home" onerror="this.onerror=null; this.style.display='none';" />
        </a>

        <!-- Titolo pagina -->
        <h1>Il villaggio neolitico</h1>

        <!-- Riquadro 2 (Guida AI) -->
        <a class="icon-btn" href="LINK_CHATBOT" target="_blank" rel="noopener" title="Guida AI">
          <img src="assets/bot.svg" alt="Guida AI" onerror="this.onerror=null; this.style.display='none';" />
        </a>
      </div>

      <!-- Linea decorativa giallo/oro -->
      <div class="gold-line" aria-hidden="true"></div>
    </header>

    <!-- =========================
         CORPO A DUE COLONNE
         ========================= -->
    <main class="main">

      <!-- Riquadro 3 (sinistra) – AREA CONTENUTO DINAMICO -->
      <section class="panel" id="content">
        <div class="content-inner" id="dynamicArea">
          <!-- All'apertura: immagine di copertina (villaggio.png da assets/) -->
          <img
            id="coverImage"
            class="cover-img"
            src="assets/villaggio.png"
            alt="Copertina - Il villaggio neolitico"
          />
        </div>
      </section>

      <!-- Riquadro 4 (destra) – TESTO DA FILE TXT -->
      <aside class="panel" id="textPanel">
        <div class="text-inner" id="textArea">
          <div class="muted">Caricamento testo in corso…</div>
        </div>
      </aside>

    </main>

    <!-- =========================
         BARRA PULSANTI IN BASSO (4 icone)
         ========================= -->
    <nav class="bottom-bar" aria-label="Azioni">
      <!-- Riquadro 5 – Google Maps -->
      <button class="bottom-btn" id="btnMap" type="button" title="Google Maps">
        <img src="assets/map.svg" alt="Mappa" onerror="this.onerror=null; this.style.display='none';" />
        <span>Maps</span>
      </button>

      <!-- Riquadro 6 – Video -->
      <button class="bottom-btn" id="btnVideo" type="button" title="Video">
        <img src="assets/video.svg" alt="Video" onerror="this.onerror=null; this.style.display='none';" />
        <span>Video</span>
      </button>

      <!-- Riquadro 7 – Immagini (galleria) -->
      <button class="bottom-btn" id="btnGallery" type="button" title="Galleria immagini">
        <img src="assets/image.svg" alt="Immagini" onerror="this.onerror=null; this.style.display='none';" />
        <span>Immagini</span>
      </button>

      <!-- Riquadro 8 – 3D -->
      <button class="bottom-btn" id="btn3D" type="button" title="3D">
        <img src="assets/cube.svg" alt="3D" onerror="this.onerror=null; this.style.display='none';" />
        <span>3D</span>
      </button>
    </nav>

  </div>

  <script>
    /* =========================
       CONFIG CONTENUTI (modifica qui, senza toccare la logica)
       ========================= */
    const CONFIG = {
      // File testo richiesto: fetch('txt/villaggio.txt')
      textFile: "txt/villaggio.txt",

      // Copertina in apertura (riquadro 3)
      coverImage: "assets/villaggio.png",

      // Google Maps (coordinate richieste dal prompt: {LAT} {LON} {ZOOM})
      lat: "LAT",
      lon: "LON",
      zoom: "ZOOM",

      // Video embed: richiesto dal prompt
      // Nota: per YouTube Shorts l'embed migliore è spesso /embed/ID
      // Qui rispetto il link dato, ma gestisco un fallback.
      videoUrl: "https://youtube.com/shorts/jQPxf3NOF0w?si=Zmxg9Q2MIB906t__",

      // Galleria immagini (tutte in assets/)
      galleryImages: [
        "assets/1.jpeg",
        "assets/2.png",
        "assets/3.png"
      ],

      // Pagina/URL 3D richiesto (oltre allo snippet sketchfab fornito nel prompt)
      link3d: "LINK_3D",

      // Snippet sketchfab (fornito nel prompt) - lo tengo pronto come HTML
      sketchfabEmbedHTML: `
        <div class="sketchfab-embed-wrapper">
          <iframe title="Villaggio Campi Diomedei - Foggia"
            frameborder="0"
            allowfullscreen
            mozallowfullscreen="true"
            webkitallowfullscreen="true"
            allow="autoplay; fullscreen; xr-spatial-tracking"
            xr-spatial-tracking
            execution-while-out-of-viewport
            execution-while-not-rendered
            web-share
            class="embed-frame"
            src="https://sketchfab.com/models/0a306cc6e14647f1960cd30c82fe0b2c/embed">
          </iframe>
          <p style="font-size: 13px; font-weight: normal; margin: 5px; color: #4A4A4A;">
            <a href="https://sketchfab.com/3d-models/villaggio-campi-diomedei-foggia-0a306cc6e14647f1960cd30c82fe0b2c?utm_medium=embed&utm_campaign=share-popup&utm_content=0a306cc6e14647f1960cd30c82fe0b2c" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">
              Villaggio Campi Diomedei - Foggia
            </a>
            by
            <a href="https://sketchfab.com/gb.prof.69?utm_medium=embed&utm_campaign=share-popup&utm_content=0a306cc6e14647f1960cd30c82fe0b2c" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">
              gb.prof.69
            </a>
            on
            <a href="https://sketchfab.com?utm_medium=embed&utm_campaign=share-popup&utm_content=0a306cc6e14647f1960cd30c82fe0b2c" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;">
              Sketchfab
            </a>
          </p>
        </div>
      `
    };

    /* =========================
       UTILS: gestione errori e contenuto dinamico
       ========================= */
    const dynamicArea = document.getElementById("dynamicArea");
    const coverImageEl = document.getElementById("coverImage");
    const textArea = document.getElementById("textArea");

    // Mostra messaggio chiaro in un pannello (riquadro 3 o 4)
    function showError(containerEl, message){
      containerEl.innerHTML = `
        <div class="error-box">
          <strong>Contenuto non disponibile.</strong><br/>
          ${message}
        </div>
      `;
    }

    // Imposta contenuto del riquadro 3 con un iframe (maps/video/3d)
    function setIframeContent(src, title){
      if(!src || src.includes("{") || src.includes("LINK_3D") || src.includes("LAT") || src.includes("LON")){
        showError(dynamicArea, "Manca un link valido o un parametro (controlla CONFIG).");
        return;
      }
      dynamicArea.innerHTML = `
        <iframe class="embed-frame" src="${src}" title="${title || 'Contenuto'}" loading="lazy" allowfullscreen></iframe>
      `;
    }

    // Ripristina copertina
    function showCover(){
      dynamicArea.innerHTML = `
        <img class="cover-img" src="${CONFIG.coverImage}" alt="Copertina - Il villaggio neolitico" />
      `;
      // Gestione errore immagine
      const img = dynamicArea.querySelector("img");
      img.onerror = () => showError(dynamicArea, "Non trovo l'immagine di copertina in assets/villaggio.png.");
    }

    /* =========================
       CARICAMENTO TESTO (fetch richiesto)
       ========================= */
    async function loadText(){
      try{
        const res = await fetch(CONFIG.textFile);
        if(!res.ok){
          throw new Error("HTTP " + res.status);
        }
        const txt = await res.text();
        textArea.textContent = txt;
      }catch(err){
        textArea.innerHTML = `
          <div class="error-box">
            <strong>Testo non disponibile.</strong><br/>
            Non riesco a caricare <code>${CONFIG.textFile}</code>.<br/>
            Verifica che esista in <code>txt/</code> e che GitHub Pages lo stia servendo correttamente.
          </div>
        `;
      }
    }

    /* =========================
       GOOGLE MAPS EMBED (coordinate richieste)
       ========================= */
    function openMap(){
      const { lat, lon, zoom } = CONFIG;

      // Validazione minima (se restano placeholder)
      if([lat, lon, zoom].some(v => !v || String(v).includes("{") || v === "LAT" || v === "LON" || v === "ZOOM")){
        showError(dynamicArea, "Coordinate non impostate. Inserisci lat/lon/zoom in CONFIG (es. lat:'41.462', lon:'15.545', zoom:'16').");
        return;
      }

      // Embed semplice Google Maps (no API key)
      // q=lat,lon + z=zoom
      const src = `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lon)}&z=${encodeURIComponent(zoom)}&output=embed`;
      setIframeContent(src, "Google Maps");
    }

    /* =========================
       VIDEO EMBED
       ========================= */
    function openVideo(){
      const url = CONFIG.videoUrl;

      if(!url || url.includes("{")){
        showError(dynamicArea, "Link video mancante o non valido (controlla CONFIG.videoUrl).");
        return;
      }

      // Provo a trasformare in embed "robusto" se è un link shorts/watch.
      const embed = toYouTubeEmbed(url);

      // YouTube spesso richiede allow espliciti
      dynamicArea.innerHTML = `
        <iframe class="embed-frame"
          src="${embed}"
          title="Video"
          loading="lazy"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      `;
    }

    // Converte vari formati YouTube (shorts/watch/youtu.be) in /embed/ID
    function toYouTubeEmbed(url){
      try{
        const u = new URL(url);

        // shorts: /shorts/VIDEOID
        if(u.pathname.startsWith("/shorts/")){
          const id = u.pathname.split("/shorts/")[1].split(/[?&/]/)[0];
          if(id) return `https://www.youtube.com/embed/${id}`;
        }

        // watch?v=VIDEOID
        if(u.pathname === "/watch"){
          const id = u.searchParams.get("v");
          if(id) return `https://www.youtube.com/embed/${id}`;
        }

        // youtu.be/VIDEOID
        if(u.hostname.includes("youtu.be")){
          const id = u.pathname.replace("/", "").split(/[?&/]/)[0];
          if(id) return `https://www.youtube.com/embed/${id}`;
        }

        // fallback: usa URL originale (potrebbe funzionare comunque)
        return url;
      }catch(e){
        return url;
      }
    }

    /* =========================
       GALLERIA: miniatura scorrevole + vista grande
       ========================= */
    function openGallery(){
      const imgs = CONFIG.galleryImages || [];
      if(!imgs.length){
        showError(dynamicArea, "Nessuna immagine configurata per la galleria (CONFIG.galleryImages).");
        return;
      }

      // Costruzione HTML galleria
      dynamicArea.innerHTML = `
        <div class="gallery">
          <div class="gallery-main" id="galleryMain">
            <img id="galleryMainImg" alt="Immagine galleria" />
          </div>
          <div class="thumbs" id="thumbs"></div>
        </div>
      `;

      const mainImg = document.getElementById("galleryMainImg");
      const thumbs = document.getElementById("thumbs");

      // Set prima immagine
      mainImg.src = imgs[0];
      mainImg.onerror = () => showError(dynamicArea, "Non riesco a caricare le immagini della galleria. Controlla i nomi in assets/.");

      // Crea thumbnails
      imgs.forEach((src, idx) => {
        const t = document.createElement("div");
        t.className = "thumb";
        t.innerHTML = `<img src="${src}" alt="Miniatura ${idx+1}">`;
        t.addEventListener("click", () => {
          mainImg.src = src;
        });

        // se una miniatura manca, la nascondo senza far esplodere tutto
        const ti = t.querySelector("img");
        ti.onerror = () => { t.style.display = "none"; };

        thumbs.appendChild(t);
      });
    }

    /* =========================
       3D: apre nel riquadro 3 un iframe a LINK_3D
       (In più: se LINK_3D non è valorizzato, mostra lo snippet Sketchfab)
       ========================= */
    function open3D(){
      const link = CONFIG.link3d;

      // Se l'utente non ha valorizzato LINK_3D, uso lo snippet sketchfab fornito
      const isPlaceholder = !link || link.includes("{") || link === "LINK_3D";

      if(isPlaceholder){
        dynamicArea.innerHTML = CONFIG.sketchfabEmbedHTML;

        // Se per qualche motivo l'iframe sketchfab non carica, messaggio
        const sf = dynamicArea.querySelector("iframe");
        if(sf){
          sf.onerror = () => showError(dynamicArea, "Embed Sketchfab non disponibile in questo momento.");
        }
        return;
      }

      // Altrimenti carico l'URL 3D come iframe richiesto
      setIframeContent(link, "3D / Pagina");
    }

    /* =========================
       EVENTI UI
       ========================= */
    document.getElementById("btnMap").addEventListener("click", openMap);
    document.getElementById("btnVideo").addEventListener("click", openVideo);
    document.getElementById("btnGallery").addEventListener("click", openGallery);
    document.getElementById("btn3D").addEventListener("click", open3D);

    // Gestione errore copertina all'avvio (se manca)
    coverImageEl.onerror = () => showError(dynamicArea, "Non trovo l'immagine di copertina in assets/villaggio.png.");

    // Avvio: carico testo e lascio copertina visibile
    loadText();
  </script>
</body>
</html>
