<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Il villaggio neolitico</title>

  <style>
    /* =========================
       CONFIG VISIVA GENERALE
       ========================= */
    :root{
      --gold: #d7b54a;          /* giallo/oro */
      --gold-soft: rgba(215,181,74,.35);
      --panel: rgba(10, 12, 16, 0.72);
      --panel-strong: rgba(10, 12, 16, 0.82);
      --text: #e9eef6;
      --muted: rgba(233,238,246,.75);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius: 16px;
      --gap: 16px;
      --maxw: 1100px;
      --minh-content: 420px;
    }

    /* Sfondo: immagine leggera */
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: url("assets/sfondo.jpg") center / cover no-repeat fixed;
      min-height: 100vh;
    }

    /* Overlay leggero per garantire leggibilità */
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 700px at 50% 10%, rgba(0,0,0,.35), rgba(0,0,0,.65));
      pointer-events: none;
      z-index: -1;
    }

    .app{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 18px 14px 22px;
      box-sizing: border-box;
    }

    /* =========================
       HEADER
       ========================= */
    header{
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 14px 10px;
      backdrop-filter: blur(6px);
    }

    .header-row{
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 10px;
    }

    .icon-btn{
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      text-decoration: none;
    }
    .icon-btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
    }

    .icon-btn img{
      width: 26px;
      height: 26px;
      display: block;
    }

    h1{
      margin: 0;
      text-align: center;
      font-size: clamp(18px, 2.4vw, 28px);
      letter-spacing: .4px;
      color: var(--gold);
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .divider{
      margin-top: 10px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .9;
    }

    /* =========================
       CORPO (DUE COLONNE)
       ========================= */
    main{
      margin-top: var(--gap);
      display: grid;
      grid-template-columns: 1.15fr .85fr; /* sinistra più ampia */
      gap: var(--gap);
    }

    .panel{
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    /* Riquadro 3: area contenuto dinamico */
    #contentArea{
      min-height: var(--minh-content);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* area interna con padding */
    .panel-inner{
      padding: 14px;
      box-sizing: border-box;
      height: 100%;
    }

    /* contenuti dinamici: immagine/iframe/galleria */
    .dynamic-wrap{
      height: 100%;
      min-height: var(--minh-content);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Copertina / immagini in riquadro 3 */
    .hero-img{
      width: 100%;
      height: clamp(260px, 42vh, 520px);
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }

    /* Iframe generico (maps, video, 3d) */
    .embed{
      width: 100%;
      height: clamp(320px, 50vh, 560px);
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
    }

    /* Messaggi di errore/avviso */
    .message{
      padding: 14px;
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.25);
      background: rgba(0,0,0,.25);
      color: var(--text);
      line-height: 1.35;
    }
    .message strong{ color: var(--gold); }

    /* Riquadro 4: testo da file TXT */
    #textPanel .panel-inner{
      height: var(--minh-content);
      overflow: auto; /* scrollbar */
    }

    #textContent{
      white-space: pre-wrap; /* mantiene a capo dal txt */
      line-height: 1.55;
      font-size: 15px;
      color: var(--text);
    }

    .text-loading{
      color: var(--muted);
      font-style: italic;
    }

    /* =========================
       BARRA PULSANTI IN BASSO
       ========================= */
    .toolbar{
      margin-top: var(--gap);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      align-items: center;
      justify-items: center;
      background: var(--panel-strong);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .tool-btn{
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      color: var(--text);
    }

    .tool-btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
    }

    .tool-btn:active{
      transform: translateY(0px);
    }

    .tool-btn img{
      width: 22px;
      height: 22px;
      display: block;
    }

    .tool-btn span{
      font-size: 14px;
      color: var(--muted);
      display: none; /* icone pure (pulito). Se vuoi testo, metti display:inline */
    }

    /* =========================
       GALLERIA (Riquadro 7)
       ========================= */
    .gallery{
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .gallery-main{
      width: 100%;
      height: clamp(260px, 42vh, 520px);
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }

    .thumbs{
      display: flex;
      gap: 10px;
      overflow-x: auto;     /* scorrimento */
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .thumb{
      flex: 0 0 auto;
      width: 92px;
      height: 62px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      opacity: .85;
      cursor: pointer;
      transition: opacity .12s ease, transform .12s ease, border-color .12s ease;
      background: rgba(255,255,255,.04);
    }
    .thumb:hover{
      opacity: 1;
      transform: translateY(-1px);
      border-color: rgba(215,181,74,.55);
    }
    .thumb.active{
      opacity: 1;
      border-color: rgba(215,181,74,.95);
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }

    /* =========================
       RESPONSIVE
       ========================= */
    @media (max-width: 860px){
      main{
        grid-template-columns: 1fr; /* colonne in verticale */
      }
      #textPanel .panel-inner{
        height: auto;
        max-height: 50vh;
      }
      .toolbar{
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 480px){
      .header-row{
        grid-template-columns: 46px 1fr 46px;
      }
      .icon-btn{ width: 40px; height: 40px; }
      .icon-btn img{ width: 24px; height: 24px; }
      .tool-btn{ padding: 10px 6px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- =========================
         HEADER
         ========================= -->
    <header>
      <div class="header-row">
        <!-- Riquadro 1 (Home) -->
        <a class="icon-btn" href="index.html" aria-label="Home">
          <img src="assets/home.svg" alt="Home" onerror="this.onerror=null; this.src=''; this.alt='[icona mancante]';" />
        </a>

        <!-- Titolo pagina -->
        <h1>Il villaggio neolitico</h1>

        <!-- Riquadro 2 (Guida AI) -->
        <a class="icon-btn" href="LINK_CHATBOT" target="_blank" rel="noopener" aria-label="Guida AI">
          <img src="assets/bot.svg" alt="Guida AI" onerror="this.onerror=null; this.src=''; this.alt='[icona mancante]';" />
        </a>
      </div>

      <div class="divider"></div>
    </header>

    <!-- =========================
         CORPO (DUE COLONNE)
         ========================= -->
    <main>
      <!-- Riquadro 3: AREA CONTENUTO DINAMICO -->
      <section id="contentArea" class="panel" aria-label="Area contenuto dinamico">
        <div class="panel-inner">
          <div id="dynamicWrap" class="dynamic-wrap">
            <!-- All’apertura: foto di copertina -->
            <!-- NOTA: se manca l'immagine, mostriamo un messaggio invece di rompere -->
            <img id="coverImage" class="hero-img" src="assets/villaggio.png" alt="Copertina: Il villaggio neolitico" />
          </div>
        </div>
      </section>

      <!-- Riquadro 4: TESTO DA FILE TXT -->
      <section id="textPanel" class="panel" aria-label="Testo">
        <div class="panel-inner">
          <div id="textContent" class="text-loading">Caricamento testo in corso…</div>
        </div>
      </section>
    </main>

    <!-- =========================
         BARRA PULSANTI (4 ICONE)
         ========================= -->
    <nav class="toolbar" aria-label="Strumenti">
      <!-- Riquadro 5: Google Maps -->
      <button class="tool-btn" id="btnMap" type="button" title="Google Maps">
        <img src="assets/map.svg" alt="Mappa" onerror="this.onerror=null; this.src=''; this.alt='[icona mancante]';" />
        <span>Mappa</span>
      </button>

      <!-- Riquadro 6: Video -->
      <button class="tool-btn" id="btnVideo" type="button" title="Video">
        <img src="assets/video.svg" alt="Video" onerror="this.onerror=null; this.src=''; this.alt='[icona mancante]';" />
        <span>Video</span>
      </button>

      <!-- Riquadro 7: Galleria immagini -->
      <button class="tool-btn" id="btnGallery" type="button" title="Immagini">
        <img src="assets/image.svg" alt="Immagini" onerror="this.onerror=null; this.src=''; this.alt='[icona mancante]';" />
        <span>Immagini</span>
      </button>

      <!-- Riquadro 8: 3D / Sketchfab o pagina esterna -->
      <button class="tool-btn" id="btn3D" type="button" title="3D">
        <img src="assets/cube.svg" alt="3D" onerror="this.onerror=null; this.src=''; this.alt='[icona mancante]';" />
        <span>3D</span>
      </button>
    </nav>
  </div>

  <script>
    /* ==========================================================
       CONFIGURAZIONE "MODELLO"
       - Qui trovi tutti i placeholder così come li hai chiesti.
       - Sostituiscili volta per volta senza toccare il resto.
       ========================================================== */
    const CONFIG = {
      // Riquadro 3: copertina iniziale
      coverImage: "assets/villaggio.png",

      // Riquadro 4: testo da file
      textFile: "txt/villaggio.txt",

      // Riquadro 5: Google Maps (placeholder richiesti)
      lat: "LAT",
      lon: "LON",
      zoom: "ZOOM",

      // Riquadro 6: video (link embed)
      videoEmbedUrl: "LINK_VIDEO_EMBED",

      // Riquadro 7: galleria (placeholder richiesti)
      galleryImages: [
        "assets/1.jpeg",
        "assets/2.jpeg",
        "assets/3.jpeg"
      ],

      // Riquadro 8: 3D / pagina esterna
      link3D: "LINK_3D"
    };

    /* ==========================================================
       UTILITA'
       ========================================================== */

    // Sostituisce il contenuto del riquadro 3 con un elemento DOM.
    function setContentArea(node) {
      const wrap = document.getElementById("dynamicWrap");
      wrap.innerHTML = "";
      wrap.appendChild(node);
    }

    // Mostra un messaggio nel riquadro 3
    function showContentMessage(title, details) {
      const box = document.createElement("div");
      box.className = "message";
      box.innerHTML = `<strong>${escapeHtml(title)}</strong><br>${escapeHtml(details || "")}`;
      setContentArea(box);
    }

    // Mostra un messaggio nel riquadro 4 (testo)
    function showTextMessage(title, details) {
      const text = document.getElementById("textContent");
      text.classList.remove("text-loading");
      text.innerHTML = `<strong style="color: var(--gold)">${escapeHtml(title)}</strong>\n\n${escapeHtml(details || "")}`;
    }

    // Escape minimo per evitare HTML indesiderato nei messaggi
    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    // Verifica "placeholder" non compilati
    function isPlaceholder(value){
      return !value || String(value).includes("{") || String(value) === "LAT" || String(value) === "LON" || String(value) === "ZOOM"
             || String(value).includes("LINK_");
    }

    /* ==========================================================
       AVVIO: COPERTINA + TESTO TXT
       ========================================================== */

    // 1) Imposta immagine copertina (con fallback messaggio)
    (function initCover(){
      const img = document.getElementById("coverImage");
      img.src = CONFIG.coverImage;

      img.onerror = function(){
        showContentMessage(
          "Copertina non trovata",
          `Non riesco a caricare: ${CONFIG.coverImage}. Controlla che il file esista in assets/.`
        );
      };
    })();

    // 2) Carica il testo dal file TXT con fetch('txt/villaggio.txt')
    (async function loadText(){
      try{
        const res = await fetch(CONFIG.textFile, { cache: "no-store" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        const raw = await res.text();

        const text = document.getElementById("textContent");
        text.classList.remove("text-loading");
        text.textContent = raw; // testo puro
      }catch(err){
        showTextMessage(
          "Testo non disponibile",
          `Non riesco a caricare: ${CONFIG.textFile}. Verifica cartella/nome file. (${err.message})`
        );
      }
    })();

    /* ==========================================================
       RIQUADRO 5: GOOGLE MAPS (apre nel riquadro 3)
       ========================================================== */
    document.getElementById("btnMap").addEventListener("click", () => {
      // Se lat/lon/zoom non sono compilati, messaggio chiaro
      if (isPlaceholder(CONFIG.lat) || isPlaceholder(CONFIG.lon) || isPlaceholder(CONFIG.zoom)) {
        showContentMessage(
          "Coordinate mancanti",
          "Compila LAT, LON e ZOOM nel file HTML (CONFIG) per mostrare Google Maps."
        );
        return;
      }

      // Costruzione embed con coordinate
      // Nota: l'embed di Google Maps può variare; questa è una soluzione robusta via query su mappe.
      const lat = encodeURIComponent(CONFIG.lat);
      const lon = encodeURIComponent(CONFIG.lon);
      const zoom = encodeURIComponent(CONFIG.zoom);

      const iframe = document.createElement("iframe");
      iframe.className = "embed";
      iframe.loading = "lazy";
      iframe.referrerPolicy = "no-referrer-when-downgrade";
      iframe.allowFullscreen = true;

      // URL "query" con zoom: funziona come visualizzazione mappa
      iframe.src = `https://www.google.com/maps?q=${lat},${lon}&z=${zoom}&output=embed`;

      iframe.onerror = () => {
        showContentMessage(
          "Mappa non caricabile",
          "Impossibile aprire l'embed di Google Maps. Controlla rete o parametri."
        );
      };

      setContentArea(iframe);
    });

    /* ==========================================================
       RIQUADRO 6: VIDEO EMBED (apre nel riquadro 3)
       ========================================================== */
    document.getElementById("btnVideo").addEventListener("click", () => {
      if (isPlaceholder(CONFIG.videoEmbedUrl)) {
        showContentMessage(
          "Link video mancante",
          "Inserisci LINK_VIDEO_EMBED (URL embed) nel file HTML (CONFIG)."
        );
        return;
      }

      const iframe = document.createElement("iframe");
      iframe.className = "embed";
      iframe.loading = "lazy";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.src = CONFIG.videoEmbedUrl;

      iframe.onerror = () => {
        showContentMessage(
          "Video non caricabile",
          "Impossibile aprire l'embed del video. Controlla che il link sia un vero URL embed."
        );
      };

      setContentArea(iframe);
    });

    /* ==========================================================
       RIQUADRO 7: GALLERIA (apre nel riquadro 3)
       - Vista grande + miniature scorrevoli
       ========================================================== */
    document.getElementById("btnGallery").addEventListener("click", () => {
      const imgs = CONFIG.galleryImages || [];
      if (!imgs.length || imgs.some(isPlaceholder)) {
        showContentMessage(
          "Galleria non configurata",
          "Inserisci i nomi corretti delle immagini (1.jpeg, 2.jpeg, 3.jpeg) in assets/ (CONFIG.galleryImages)."
        );
        return;
      }

      const gallery = document.createElement("div");
      gallery.className = "gallery";

      const mainImg = document.createElement("img");
      mainImg.className = "gallery-main";
      mainImg.alt = "Immagine galleria (vista grande)";
      mainImg.src = imgs[0];

      // Se l'immagine grande non esiste -> messaggio chiaro
      mainImg.onerror = () => {
        showContentMessage(
          "Immagini mancanti",
          `Non riesco a caricare: ${mainImg.src}. Controlla assets/.`
        );
      };

      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";

      imgs.forEach((src, idx) => {
        const t = document.createElement("img");
        t.className = "thumb" + (idx === 0 ? " active" : "");
        t.src = src;
        t.alt = "Miniatura " + (idx + 1);

        // Se una miniatura manca, non rompiamo tutto: la rendiamo "disattivata"
        t.onerror = () => {
          t.classList.remove("active");
          t.style.opacity = "0.35";
          t.style.cursor = "not-allowed";
          t.title = "File mancante: " + src;
        };

        t.addEventListener("click", () => {
          // Se questa miniatura è mancante, ignora
          if (t.style.cursor === "not-allowed") return;

          mainImg.src = src;

          // stato active
          [...thumbs.querySelectorAll(".thumb")].forEach(x => x.classList.remove("active"));
          t.classList.add("active");
        });

        thumbs.appendChild(t);
      });

      gallery.appendChild(mainImg);
      gallery.appendChild(thumbs);

      setContentArea(gallery);
    });

    /* ==========================================================
       RIQUADRO 8: 3D (Sketchfab o pagina esterna) (apre nel riquadro 3)
       ========================================================== */
    document.getElementById("btn3D").addEventListener("click", () => {
      if (isPlaceholder(CONFIG.link3D)) {
        showContentMessage(
          "Link 3D mancante",
          "Inserisci LINK_3D nel file HTML (CONFIG). Può essere una pagina Sketchfab o altro URL embeddabile."
        );
        return;
      }

      const iframe = document.createElement("iframe");
      iframe.className = "embed";
      iframe.loading = "lazy";
      iframe.allowFullscreen = true;
      iframe.src = CONFIG.link3D;

      iframe.onerror = () => {
        showContentMessage(
          "3D non caricabile",
          "Impossibile aprire l'iframe. Verifica che l'URL permetta l'embedding (X-Frame-Options)."
        );
      };

      setContentArea(iframe);
    });

    /* ==========================================================
       EXTRA: se vuoi tornare alla copertina cliccando sul titolo
       (Non richiesto, ma utile. Se non lo vuoi, elimina questo blocco.)
       ========================================================== */
    document.querySelector("h1").addEventListener("click", () => {
      const img = document.createElement("img");
      img.className = "hero-img";
      img.alt = "Copertina: Il villaggio neolitico";
      img.src = CONFIG.coverImage;
      img.onerror = () => {
        showContentMessage(
          "Copertina non trovata",
          `Non riesco a caricare: ${CONFIG.coverImage}. Controlla che il file esista in assets/.`
        );
      };
      setContentArea(img);
    });
  </script>

  <!--
    ==========================================================
    Cartelle richieste
    - assets/ (icone + immagini)
    - txt/ (file testo)
    ==========================================================
  -->
</body>
</html>
