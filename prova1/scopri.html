<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Scopri – Villaggio neolitico</title>
  <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="scopri">

  <!-- SEZIONE 1: barra in alto -->
  <header class="topbar" aria-label="Barra di navigazione">
    <div class="topbar-row">
      <a class="topbtn" href="../index.html" aria-label="Home" title="Home">
        <span class="ico">🏠</span>
      </a>

      <div class="topbar-title">
        <div class="kicker">SCOPRI</div>
        <h1 id="page-title">Villaggio neolitico</h1>
      </div>

      <button class="topbtn" id="btn-guide" type="button" aria-label="Apri chatbot" title="La tua guida AI">
        <span class="ico">💬</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- COLONNA SINISTRA -->
    <section class="left">

      <!-- SEZIONE 2: immagine / contenitore media (qui si aprono video/galleria/3D/map) -->
      <section class="media2" aria-label="Contenuti multimediali">
        <div class="media2-head">
          <div class="media2-chip" id="media-label">Copertina</div>
          <button class="media2-close" id="media-reset" type="button" aria-label="Ripristina copertina" title="Torna alla copertina">↺</button>
        </div>
        <div class="media2-body" id="media2-body">
          <img class="media-img" id="cover-img" src="../assets/img/IMG_4125.png" alt="Villaggio neolitico - copertina"/>
        </div>
      </section>

      <!-- SEZIONI 4-5-6: icone -->
      <div class="mini-row" aria-label="Azioni">
        <button class="mini" id="btn-video" type="button" title="Guarda il video">
          <span class="mini-ico">🎥</span><span class="mini-txt">Video</span>
        </button>
        <button class="mini" id="btn-gallery" type="button" title="Apri la galleria">
          <span class="mini-ico">🖼️</span><span class="mini-txt">Galleria</span>
        </button>
        <button class="mini" id="btn-3d" type="button" title="Apri il 3D">
          <span class="mini-ico">🧊</span><span class="mini-txt">3D</span>
        </button>
      </div>

      <!-- SEZIONE 7: maps -->
      <button class="wide" id="btn-map" type="button" title="Apri la mappa">
        <span class="wide-ico">🗺️</span>
        <span class="wide-txt">Apri Google Maps (Campi Diomedei)</span>
      </button>

    </section>

    <!-- COLONNA DESTRA -->
    <section class="right">
      <!-- SEZIONE 3: testo da villaggio.txt -->
      <article class="textbox" id="textbox" aria-label="Testo">
        <div class="loading">Caricamento testo…</div>
      </article>
    </section>
  </main>

  <script src="../assets/js/app.js"></script>
</body>
</html>
